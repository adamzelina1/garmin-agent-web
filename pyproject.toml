[project]
name = "garmin-project"
version = "0.1.0"
description = "Data fetcher for Garmin Connect"
requires-python = ">=3.14"
dependencies = [
    "garminconnect>=0.3.9",
    "gradio>=6.22.0",
    "httpx>=0.28.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pydantic-ai>=2.27.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.0",
]

[project.scripts]
garmin-fetch = "garmin_fetch.fetcher:main"
garmin-ask = "garmin_fetch.ask:main"
garmin-ask-web = "garmin_fetch.ask_web:main"
garmin-trace = "garmin_fetch.trace:main"
garmin-ml = "garmin_fetch.ml:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_fetch"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
    "pytest>=9.1.1",
]
